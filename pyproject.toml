[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping"
version = "0.1.0"
description = "clip-ing: motor de clipping automatizado (clips verticales con subtítulos)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
# Dependencias pesadas: solo en la PC de casa (setup.ps1 las instala)
full = [
    "yt-dlp",
    "faster-whisper>=1.0",
    "scenedetect[opencv]>=0.6",
    "numpy",
]
dev = ["pytest>=8"]

[project.scripts]
clip = "clipping.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
